<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đô Thị Ảo — M2 • Shop + ATM • Colyseus</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a2b1a; touch-action: none; }
  canvas { display: block; touch-action: none; }
  #fallback { display: none; position: fixed; inset: 0; background: #222; color: #fff;
    font-family: sans-serif; padding: 40px 20px; text-align: center; z-index: 10; }
  /* --- connection status pill (top-center) --- */
  #netStatus { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6;
    background: rgba(0,0,0,0.55); color: #fff; font-family: sans-serif; font-size: 13px;
    padding: 5px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
  /* --- CHAT button (mobile + desktop) --- */
  #chatBtn { position: fixed; right: 14px; bottom: 168px; z-index: 6; width: 56px; height: 56px;
    border-radius: 50%; border: 2px solid #fff; background: rgba(41,128,185,0.9); color: #fff;
    font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; }
  #chatBtn:active { background: rgba(31,97,141,0.95); }
  /* --- ATM button (M2 bug fix: there was no ATM button on screen) --- */
  #atmBtn { position: fixed; right: 14px; bottom: 308px; z-index: 6; width: 56px; height: 56px;
    border-radius: 50%; border: 2px solid #fff; background: rgba(142,68,173,0.9); color: #fff;
    font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; pointer-events: auto; }
  #atmBtn:active { background: rgba(109,50,133,0.95); }
  /* --- SHOP button (M2) --- */
  #shopBtn { position: fixed; right: 14px; bottom: 238px; z-index: 6; width: 56px; height: 56px;
    border-radius: 50%; border: 2px solid #fff; background: rgba(39,174,96,0.9); color: #fff;
    font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; pointer-events: auto; }
  #shopBtn:active { background: rgba(30,132,73,0.95); }
  /* --- shop / ATM panels (M2, DOM overlay — money input is DOM per Hybrid UI) --- */
  .econPanel { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 8;
    width: min(360px, calc(100vw - 20px)); max-height: 62vh; overflow-y: auto;
    background: rgba(10,18,28,0.94); border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
    color: #fff; font-family: sans-serif; display: none; padding: 12px; box-sizing: border-box; }
  .econPanel.open { display: block; }
  .econPanel h3 { margin: 0 0 4px; font-size: 16px; }
  .econPanel .sub { font-size: 12px; color: #bbb; margin-bottom: 8px; }
  .econPanel .walletLine { font-size: 13px; color: #ffe082; margin-bottom: 8px; }
  .econPanel .closeBtn { float: right; background: transparent; border: none; color: #fff;
    font-size: 16px; cursor: pointer; padding: 0 4px; }
  .shopRow { display: flex; align-items: center; gap: 6px; padding: 8px 4px;
    border-top: 1px solid rgba(255,255,255,0.15); font-size: 13px; }
  .shopRow .shopName { flex: 1; min-width: 0; }
  .shopRow .shopDesc { color: #aaa; font-size: 12px; }
  .shopRow .shopPrice { color: #ffe082; font-weight: bold; white-space: nowrap; }
  .shopRow .shopSale { color: #a5e08a; font-size: 11px; font-weight: normal; }
  .shopRow .shopHave { color: #ccc; font-size: 12px; white-space: nowrap; }
  .shopBtn { background: #27ae60; color: #fff; border: none; border-radius: 8px;
    font-size: 13px; font-weight: bold; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
  .shopBtn:disabled { opacity: 0.5; }
  .shopBtn.useBtn { background: #2980b9; }
  .econMsg { font-size: 13px; min-height: 18px; margin-top: 6px; }
  .atmRow { display: flex; gap: 6px; margin: 8px 0; }
  .atmRow input { flex: 1; min-width: 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px; outline: none; color: #fff; font-size: 15px; padding: 9px 10px; font-family: sans-serif; }
  .atmRow button { background: #2980b9; color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: bold; padding: 0 14px; cursor: pointer; }
  .atmRow button:disabled { opacity: 0.5; cursor: default; }
  /* --- chat panel (bottom-left DOM overlay) --- */
  #chatPanel { position: fixed; left: 10px; bottom: 10px; z-index: 7; width: min(360px, calc(100vw - 20px));
    background: rgba(10,18,28,0.88); border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
    color: #fff; font-family: sans-serif; display: none; flex-direction: column; overflow: hidden; }
  #chatPanel.open { display: flex; }
  #chatTabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.2); }
  #chatTabs button { flex: 1; background: transparent; border: none; color: #ccc; font-size: 13px;
    font-weight: bold; padding: 8px 4px; cursor: pointer; }
  #chatTabs button.active { color: #ffe082; background: rgba(255,255,255,0.08); }
  #chatClose { flex: 0 0 34px !important; color: #fff !important; }
  #chatLog { height: 150px; overflow-y: auto; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
  #chatLog .line { margin: 2px 0; word-wrap: break-word; }
  #chatLog .sys { color: #aaa; font-style: italic; }
  #chatRow { display: flex; border-top: 1px solid rgba(255,255,255,0.2); }
  #chatInput { flex: 1; min-width: 0; background: rgba(255,255,255,0.08); border: none; outline: none;
    color: #fff; font-size: 14px; padding: 10px; font-family: sans-serif; }
  #chatInput::placeholder { color: #999; }
  #chatSend { background: #27ae60; color: #fff; border: none; font-size: 14px; font-weight: bold;
    padding: 0 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="fallback">
  <h2>Không tải được PixiJS</h2>
  <p>Cần mạng để tải PixiJS v8 từ CDN jsDelivr.<br>Kiểm tra mạng rồi tải lại trang.</p>
</div>
<div id="netStatus">Đang kết nối…</div>
<button id="chatBtn" type="button">CHAT</button>
<button id="shopBtn" type="button">SHOP</button>
<button id="atmBtn" type="button">ATM</button>
<div id="shopPanel" class="econPanel">
  <button type="button" class="closeBtn" id="shopClose">✕</button>
  <h3>Cửa Hàng Tiện Lợi 24/7</h3>
  <div class="sub">Mua đồ ăn, nước uống. Giá ban ngày rẻ hơn 10% (bánh mì).</div>
  <div class="walletLine" id="shopWallet"></div>
  <button type="button" class="shopBtn" id="shopAtmBtn" style="background:#8e44ad;margin-bottom:8px;">ATM — Gửi / Rút tiền</button>
  <div id="shopList"></div>
  <div class="econMsg" id="shopMsg"></div>
</div>
<div id="atmPanel" class="econPanel">
  <button type="button" class="closeBtn" id="atmClose">✕</button>
  <h3>Ngân Hàng — ATM</h3>
  <div class="sub">Gửi / rút tiền. 1.000đ – 200.000đ / lần, tối đa 500.000đ / ngày.</div>
  <div class="walletLine" id="atmWallet"></div>
  <div class="atmRow">
    <input id="atmAmount" type="number" min="1000" max="200000" step="1000" value="20000" inputmode="numeric">
    <button type="button" id="atmDeposit">Gửi</button>
    <button type="button" id="atmWithdraw">Rút</button>
  </div>
  <div class="econMsg" id="atmMsg"></div>
</div>
<div id="chatPanel">
  <div id="chatTabs">
    <button type="button" data-channel="world">Thế giới</button>
    <button type="button" data-channel="nearby" class="active">Gần</button>
    <button type="button" data-channel="private">Riêng</button>
    <button type="button" id="chatClose">✕</button>
  </div>
  <div id="chatLog"></div>
  <div id="chatRow">
    <input id="chatInput" type="text" maxlength="200" placeholder="Nhắn tin… (Enter để gửi)" autocomplete="off">
    <button id="chatSend" type="button">Gửi</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.13.0/dist/pixi.min.js"></script>
<script>
  if (typeof PIXI === 'undefined') { document.getElementById('fallback').style.display = 'block'; }
</script>
<script src="https://cdn.jsdelivr.net/npm/colyseus.js@0.15/dist/colyseus.js"></script>
<!-- Supabase JS (M2, optional — only used when SUPABASE_URL/ANON_KEY are set) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/colliders.js"></script>
<script src="shared/botBrain.js"></script>
<script src="src/net.js"></script>
<script src="src/economy.js"></script>
<script src="src/main.js"></script>
</body>
</html>
